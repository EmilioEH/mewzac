# Builds the firmware (the FM-1 package and the emulator) on every push, with the build's checks.
# On main it also publishes the site (emulator, installer, rescue) to GitHub Pages
# (Settings -> Pages -> Source: GitHub Actions). Tags (v0.2) also get a release with the .fwsc.
name: build
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fm1 build
      - run: node tools/sim.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mewzac
          path: |
            build/*.fwsc
            build/sim/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/*.fwsc
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
